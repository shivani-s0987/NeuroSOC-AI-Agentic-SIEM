id: password_spraying
name: Password Spraying Detection
description: Failed authentication attempts against multiple accounts from one source.
enabled: true
severity: high
category: authentication
tags: [brute-force, password-spray]
logsource: {category: authentication}
detection:
  selection: {event_type: authentication_failure}
  condition: selection
  timeframe: 10m
  count: 5
  distinct_by: username
  group_by: [source_ip]
mitre: {tactics: [TA0006], techniques: [T1110]}
response: {create_alert: true, recommended_action: Review accounts and authentication sources for broader spraying activity.}
version: 1
