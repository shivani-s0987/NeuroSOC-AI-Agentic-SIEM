[project]
name = "neurosoc"
version = "0.1.0"
description = "AI-assisted SOC and SIEM platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "httpx==0.27.2",
  "jinja2==3.1.4",
  "typer==0.12.4",
  "rich==13.9.0",
  "pyyaml==6.0.3",
  "argon2-cffi==23.1.0",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "ruff==0.9.2",
  "pytest-cov==6.0.0",
  "PyJWT==2.9.0",
  "python-multipart==0.0.21",
  "itsdangerous==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
