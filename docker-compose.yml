services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neurosoc
      POSTGRES_USER: neurosoc
      POSTGRES_PASSWORD: neurosoc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurosoc -d neurosoc"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://neurosoc:neurosoc@postgres:5432/neurosoc
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-random-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-another-random-secret}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres-data:
